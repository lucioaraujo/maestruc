name: Maestruc — build & test

# Builds the Maestruc app and runs the test suite on GitHub's hosted runners
# (real Windows and macOS toolchains). Packages (.deb, AppImage, .tar.gz,
# NSIS, DMG) come with the release workflow, before the first tag.
#
# Triggers: pull requests and the manual button, never every push: routine
# validation is local (ctest), CI is the gate for what cannot be built here.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Maestruc
        uses: actions/checkout@v4

      # JUCE is not versioned in this repository (same policy as the rest of
      # the RASGO family). Pinned to a tag.
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: '9.0.3'
          path: JUCE-checkout

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMAESTRUC_JUCE_DIR=${{ github.workspace }}/JUCE-checkout

      - name: Build (app and tests)
        run: cmake --build build --config Release --parallel 2

      # The JACK test skips itself without a server; the bridge test (fork)
      # is not built on Windows.
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --timeout 900
